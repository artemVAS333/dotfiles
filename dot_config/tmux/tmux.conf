# Main settings and status bar position
set -g status-position top
set -g status 3 

set -g mode-keys vi
set -g mouse off 
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Colors and terminal
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"

bind-key -n M-d display-popup -d "#{pane_current_path}" -E -w 90% -h 80% "lazydocker"
bind-key -n M-g display-popup -d "#{pane_current_path}" -E -w 90% -h 80% "lazygit"
bind-key -n M-b display-popup -d "#{pane_current_path}" -E -w 90% -h 80% "lazysql"
bind-key -n M-f display-popup -d "#{pane_current_path}" -E -w 80% -h 80% "fzf --multi | pbcopy"

unbind '"'
unbind '%'
unbind 'z'
unbind '['
unbind ']'
unbind 'x'

unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9

bind-key r source-file ~/.config/tmux/tmux.conf \; \
    display-message "Config reloaded!"

bind-key -n M-e \
    set prefix None \; \
    set key-table off \; \
    set -g status-format[0] "#[align=centre,bg=#f38ba8,fill=#f38ba8,fg=#11111b,bold] Tmux keys DISABLED "

bind-key -T off M-e \
    set -u prefix \; \
    set -u key-table \; \
    set -g status-format[0] ""

bind-key -n M-c copy-mode
bind-key -T copy-mode M-c send-keys -X cancel

bind-key -n M-t new-window -c "#{pane_current_path}"
bind-key -n M-w confirm-before -p "Kill window '#W'? (y/n)" kill-window

bind-key -n M-s split-window -h -c "#{pane_current_path}"
bind-key -n M-v split-window -v -c "#{pane_current_path}"
bind-key -n M-x confirm-before -p "Kill pane '#P'? (y/n)" kill-pane

bind-key -n M-z resize-pane -Z

# Window navigation
bind-key -n M-r last-window
bind-key -n M-o next-window
bind-key -n M-i previous-window

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# Vim-style keybindings for copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Smart Splits Plugin options
set -g @smart-splits_no_wrap 'wrap'
set -g @smart-splits_move_left_key 'C-h'
set -g @smart-splits_move_down_key 'C-j'
set -g @smart-splits_move_up_key 'C-k'
set -g @smart-splits_move_right_key 'C-l'
set -g @smart-splits_resize_left_key 'M-h'
set -g @smart-splits_resize_down_key 'M-j'
set -g @smart-splits_resize_up_key 'M-k'
set -g @smart-splits_resize_right_key 'M-l'
set -g @smart-splits_resize_step_size '3'

# Configure Catppuccin theme
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %H:%M"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'atomicstack/tmux-popup-control'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'

# Initialize TPM 
run "~/.tmux/plugins/tpm/tpm"

set -g mode-style "fg=#1e1e2e,bg=#89b4fa,bold"

set -g status-format[0] ""
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-format[2] ""

